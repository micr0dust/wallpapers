<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Civ</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  /* 輕微暗角，讓畫面更有電影感 */
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(0,0,0,0.28) 100%); }
  #fade { position: fixed; inset: 0; background: #0b1020; pointer-events: none; opacity: 1; transition: opacity 2.2s ease; }
  #fade.gone { opacity: 0; }
  #hud { display: none; position: fixed; left: 22px; bottom: 22px; padding: 12px 16px; border-radius: 12px;
    background: rgba(12,18,32,0.42); color: #f2f5fb; font: 14px/1.55 "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); pointer-events: none; min-width: 170px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }
  #hud .t { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="hud"></div>
<div id="fade"></div>

<script src="three.min.js"></script>
<script src="config.js"></script>
<script src="geo.js"></script>
<script src="terrain.js"></script>
<script src="grid.js"></script>
<script src="tree.js"></script>
<script src="effects.js"></script>
<script src="sky.js"></script>
<script src="buildings.js"></script>
<script src="walls.js"></script>
<script src="villager-rig.js"></script>
<script src="villager.js"></script>
<script src="camera-controller.js"></script>
<script src="world.js"></script>
<script src="game.js"></script>
<script>
  Config.applyQuery();
  const game = new Game(document.getElementById('game'));
  window.game = game;
  try {
    game.init();
    game.start();
  } catch (e) {
    console.error('初始化失敗', e);
    document.body.style.background = '#222';
  }
</script>
</body>
</html>
